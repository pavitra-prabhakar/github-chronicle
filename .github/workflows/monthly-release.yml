name: Monthly Release

on:
  schedule:
    - cron: "45 4 1 * *" # 1st of every month, after the daily run
  workflow_dispatch:
    inputs:
      month:
        description: "Month to release (YYYY-MM). Defaults to last month."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create release vYYYY.MM
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MONTH: ${{ github.event.inputs.month }}
        run: |
          set -euo pipefail
          MONTH="${INPUT_MONTH:-$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)}"
          TAG="v${MONTH/-/.}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 0
          fi
          NOTES="${RUNNER_TEMP}/notes.md"
          set +e
          python scripts/monthly_notes.py "${MONTH}" > "${NOTES}"
          rc=$?
          set -e
          if [ "${rc}" -eq 3 ]; then
            echo "No daily entries for ${MONTH}; skipping."
            exit 0
          elif [ "${rc}" -ne 0 ]; then
            exit "${rc}"
          fi
          gh release create "${TAG}" --target main --title "GitHub Chronicle ${MONTH}" --notes-file "${NOTES}"
