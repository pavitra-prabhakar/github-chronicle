name: Daily Chronicle

on:
  schedule:
    - cron: "17 3 * * *" # once a day, 03:17 UTC (08:47 IST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-chronicle
  cancel-in-progress: false

jobs:
  chronicle:
    name: Write today's entry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate entry on a daily branch
        id: gen
        run: |
          DAY="$(date -u +%F)"
          BRANCH="daily/${DAY}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists; today's PR is already open or pending."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "${BRANCH}"
          python scripts/daily.py

      - name: Commit, open pull request and merge
        if: steps.gen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.gen.outputs.branch }}
          TITLE: ${{ steps.gen.outputs.title }}
          FILE: ${{ steps.gen.outputs.file }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(daily): ${TITLE}"
          git push -u origin "${BRANCH}"
          BODY="${RUNNER_TEMP}/pr-body.md"
          {
            echo "Automated daily entry: [\`${FILE}\`](${REPO_URL}/blob/main/${FILE})"
            echo
            echo "- Adds today's file under \`daily/\`"
            echo "- Refreshes the **Latest updates** section of the README"
            echo "- Updates \`data/state.json\` (which changelog entries have been recorded)"
            echo
            echo "Generated by \`scripts/daily.py\` from the [GitHub Changelog](https://github.blog/changelog/) and \`data/milestones.json\`."
          } > "${BODY}"
          gh pr create --base main --head "${BRANCH}" --title "${TITLE}" --body-file "${BODY}" --label daily || \
            gh pr create --base main --head "${BRANCH}" --title "${TITLE}" --body-file "${BODY}"
          if ! gh pr merge "${BRANCH}" --squash --delete-branch; then
            echo "Immediate merge failed; enabling auto-merge instead."
            gh pr merge "${BRANCH}" --squash --auto --delete-branch
          fi

      - name: Fast-forward dev to main
        if: steps.gen.outputs.changed == 'true'
        run: |
          git fetch origin main dev || true
          if git push origin "refs/remotes/origin/main:refs/heads/dev"; then
            echo "dev is up to date with main"
          else
            echo "::notice::dev has its own commits, so it was not fast-forwarded. Open a PR from dev to main when ready."
          fi
